apiVersion: v1
kind: Secret
metadata:
  name: {{ include "awx-mcp-server.fullname" . }}
  labels:
    {{- include "awx-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ .Values.secrets.adminToken | quote }}
  # AWX credentials for env-var mode. Keys always exist so secretKeyRef resolves
  # even when unused (baseUrl empty / token vs password path).
  awx-token: {{ .Values.secrets.awxToken | quote }}
  awx-password: {{ .Values.secrets.awxPassword | quote }}
