[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awx-mcp-server"
version = "1.3.0"
description = "AWX MCP Server - Control AWX/AAP/Ansible Tower through the Model Context Protocol"
requires-python = ">=3.10"
authors = [
    {name = "ldalcantara", email = "ldalcantara@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["awx", "ansible", "mcp", "automation", "model-context-protocol", "github-copilot", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # <2: the MCP Python SDK 2.0 removed the 1.x low-level Server decorators
    # (Server.list_tools & co.) that mcp_server.py is written against; an
    # unpinned install boots and then dies with AttributeError. Lift the cap
    # together with a port to the 2.x API.
    "mcp>=1.0.0,<2",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "click>=8.1.0",
    "rich>=13.0.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0.0",
    "awxkit>=23.0.0",
    "pyyaml>=6.0.0",
    "keyring>=25.0.0",
]

[project.urls]
Homepage = "https://github.com/ldalcantara/awx-mcp-server"
Repository = "https://github.com/ldalcantara/awx-mcp-server.git"
Issues = "https://github.com/ldalcantara/awx-mcp-server/issues"
Documentation = "https://github.com/ldalcantara/awx-mcp-server/blob/main/README.md"

[tool.mcp]
name = "io.github.ldalcantara/awx-mcp-server"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]
kubernetes = [
    "kubernetes>=28.1.0",
]

[project.scripts]
awx-mcp-server = "awx_mcp_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Pin the formatter/linter line length explicitly so black and ruff agree
# (both default to 88, but make it non-negotiable in-repo).
[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Rules deliberately not enforced. Each one is a decision, not a backlog: if a
# finding here is ever worth fixing, delete the line and fix it, don't add a
# per-line noqa.
ignore = [
    # Blind `except Exception` at a tool/CLI boundary is the point: a handler
    # turns any upstream failure into an MCP error payload, and the server must
    # not die because AWX returned something unexpected.
    "BLE001",
    # `Depends(...)` in a parameter default is how FastAPI declares dependencies;
    # the rule's advice does not apply to this framework.
    "B008",
    # `datetime.utcnow()`. Real finding, deliberately deferred: the fix changes
    # every timestamp this server emits (naive -> "+00:00"), which is an API
    # change for anything parsing /health or the monitoring payloads. TODO: move
    # to timezone-aware datetimes in a change of its own.
    "DTZ003",
    # `try/except/pass` when parsing an error body: the code falls back to the
    # raw response text and logs it on the next line, so there is nothing to
    # report that is not already reported.
    "S110",
    # `__all__` is grouped by category with comments, which reads better than
    # one alphabetical list.
    "RUF022",
    # `__aenter__` returning `Self` needs Python 3.11 or a typing_extensions
    # dependency; this package targets 3.10.
    "PYI034",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=awx_mcp_server"

[tool.mypy]
python_version = "3.10"
# Third-party deps (kubernetes, awxkit, yaml, ...) ship no type stubs.
ignore_missing_imports = true
